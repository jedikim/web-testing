<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Backend Simple UI</title>
    <style>
      :root {
        --bg: #f4f7f2;
        --panel: #ffffff;
        --line: #d6dfcf;
        --ink: #152014;
        --brand: #1f6f4a;
        --muted: #5d6d5e;
      }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Noto Sans KR", sans-serif;
        background: radial-gradient(circle at 10% 10%, #e5f2e8, var(--bg));
        color: var(--ink);
      }
      .app {
        max-width: 1100px;
        margin: 24px auto;
        padding: 0 16px;
      }
      .title {
        margin: 0 0 12px;
        font-size: 28px;
        font-weight: 700;
      }
      .subtitle {
        margin: 0 0 20px;
        color: var(--muted);
      }
      .grid {
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 16px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 14px;
      }
      .section-title {
        margin: 0 0 10px;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--muted);
      }
      .row {
        display: flex;
        gap: 8px;
      }
      input,
      textarea,
      select,
      button {
        font: inherit;
      }
      input,
      textarea,
      select {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        box-sizing: border-box;
        background: #fbfdfa;
      }
      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 12px;
        background: var(--brand);
        color: #fff;
        cursor: pointer;
      }
      button.secondary {
        background: #446550;
      }
      ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      li.session {
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        margin-bottom: 8px;
        cursor: pointer;
      }
      li.session.active {
        border-color: var(--brand);
        box-shadow: inset 0 0 0 1px var(--brand);
      }
      .turns {
        max-height: 420px;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 10px;
        background: #fcfffb;
      }
      .turn {
        margin-bottom: 10px;
        padding-bottom: 10px;
        border-bottom: 1px dashed var(--line);
      }
      .turn:last-child {
        border-bottom: 0;
      }
      .meta {
        color: var(--muted);
        font-size: 12px;
      }
      .role {
        font-weight: 700;
      }
      .toolbar {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 10px;
      }
      .status {
        font-size: 12px;
        color: var(--muted);
      }
      @media (max-width: 900px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <h1 class="title">Backend Simple Mode</h1>
      <p class="subtitle">
        Session-based multi-turn automation guidance backend. Create a session, chat, and track turn history.
      </p>

      <div class="grid">
        <section class="card">
          <h2 class="section-title">Create Session</h2>
          <div class="row">
            <input id="titleInput" placeholder="Session title" />
          </div>
          <div class="row" style="margin-top: 8px">
            <select id="modeInput">
              <option value="backend_simple">backend_simple</option>
              <option value="sdk_detailed">sdk_detailed</option>
            </select>
          </div>
          <div class="row" style="margin-top: 8px">
            <input id="workflowInput" placeholder="workflowId (optional)" />
          </div>
          <div class="row" style="margin-top: 8px">
            <button id="createBtn">Create</button>
            <button id="refreshBtn" class="secondary">Refresh</button>
          </div>

          <h2 class="section-title" style="margin-top: 16px">Sessions</h2>
          <ul id="sessionList"></ul>
        </section>

        <section class="card">
          <div class="toolbar">
            <h2 class="section-title" style="margin: 0">Conversation</h2>
            <span id="status" class="status">No session selected</span>
          </div>

          <div id="turns" class="turns"></div>

          <div class="row" style="margin-top: 10px">
            <textarea id="messageInput" rows="4" placeholder="Ask what to automate or how to proceed"></textarea>
          </div>

          <div class="row" style="margin-top: 8px">
            <input id="screenshotInput" placeholder="screenshot path (optional)" />
          </div>

          <div class="row" style="margin-top: 8px">
            <button id="sendBtn">Send</button>
            <button id="closeBtn" class="secondary">Close Session</button>
          </div>
        </section>
      </div>
    </main>

    <script src="/backend/ui/app.js" type="module"></script>
  </body>
</html>
