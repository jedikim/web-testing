<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evolution Backend Test UI</title>
    <style>
      :root {
        --bg: #f6f5f2;
        --surface: #ffffff;
        --text: #122017;
        --accent: #0f6a4b;
        --muted: #65736c;
        --danger: #b03a2e;
        --ok: #157347;
      }

      body {
        margin: 0;
        font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
        background: radial-gradient(circle at 20% 10%, #dcefe4, transparent 45%), var(--bg);
        color: var(--text);
      }

      main {
        max-width: 1080px;
        margin: 0 auto;
        padding: 20px;
      }

      .card {
        background: var(--surface);
        border-radius: 14px;
        padding: 16px;
        box-shadow: 0 10px 35px rgba(18, 32, 23, 0.08);
        margin-bottom: 16px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 24px;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      .grid {
        display: grid;
        gap: 10px;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      }

      label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 13px;
      }

      input,
      textarea,
      select,
      button {
        font: inherit;
      }

      input,
      textarea,
      select {
        border: 1px solid #c8d6cf;
        border-radius: 10px;
        padding: 10px;
        background: #fbfdfc;
      }

      textarea {
        min-height: 80px;
        resize: vertical;
      }

      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 10px 14px;
        color: #fff;
        background: var(--accent);
        cursor: pointer;
      }

      button.secondary {
        background: #4b6158;
      }

      button.danger {
        background: var(--danger);
      }

      .status {
        font-weight: 600;
      }

      .status.promoted,
      .status.awaiting_approval {
        color: var(--ok);
      }

      .status.failed,
      .status.rejected {
        color: var(--danger);
      }

      pre {
        margin: 0;
        background: #f0f4f2;
        border-radius: 10px;
        padding: 12px;
        overflow: auto;
        max-height: 360px;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <h1>Evolution Backend Test UI</h1>
        <p>버그/예외 기반 버전 진화 백엔드 상태를 생성/모니터링하는 테스트 UI</p>
      </section>

      <section class="card">
        <div class="grid">
          <label>
            Title
            <input id="title" value="KR scenario exception recovery" />
          </label>
          <label>
            Trigger
            <select id="trigger">
              <option value="exception">exception</option>
              <option value="bug">bug</option>
            </select>
          </label>
          <label>
            Workflow ID
            <input id="workflowId" value="kr-naver-complex-flow" />
          </label>
          <label>
            Requested By
            <input id="requestedBy" value="tester" />
          </label>
          <label>
            Test Command
            <input id="testCommand" value="npm run test:acceptance" />
          </label>
          <label>
            Max Auto Fix Attempts
            <input id="maxAutoFixAttempts" type="number" min="0" value="1" />
          </label>
        </div>
        <label style="margin-top: 10px">
          Notes
          <textarea id="notes">실패 시나리오를 추가하고 자동 수정 루프를 확인한다.</textarea>
        </label>
        <div class="actions" style="margin-top: 10px">
          <button id="createBtn">Create Job</button>
          <button id="refreshBtn" class="secondary">Refresh Jobs</button>
        </div>
      </section>

      <section class="card">
        <div class="actions" style="margin-bottom: 10px">
          <label style="flex: 1">
            Active Job ID
            <input id="activeJobId" placeholder="job id" />
          </label>
          <button id="watchBtn" class="secondary">Watch (SSE)</button>
          <button id="approveBtn">Approve</button>
          <button id="rejectBtn" class="danger">Reject</button>
          <button id="retryBtn" class="secondary">Retry</button>
        </div>
        <div>Current Status: <span id="status" class="status">-</span></div>
      </section>

      <section class="card">
        <h3 style="margin-top: 0">Jobs</h3>
        <pre id="jobsPane">[]</pre>
      </section>

      <section class="card">
        <h3 style="margin-top: 0">Live Snapshot</h3>
        <pre id="snapshotPane">{}</pre>
      </section>
    </main>
    <script src="/evolution/ui/app.js" type="module"></script>
  </body>
</html>
